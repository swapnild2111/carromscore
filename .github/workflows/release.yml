name: Release

# Automated release pipeline.
#
# Usage: Actions → Release → Run workflow
#   bump:  patch | minor | major
#   notes: bullet-point summary of what changed (markdown OK)
#
# What it does:
#   1. Reads current version from src/lib/version.ts
#   2. Computes next version (semver bump)
#   3. Bumps all four version files + commits + tags + pushes to main
#   4. Builds + signs the TWA APK with Java 17 + Android build-tools
#   5. Creates a GitHub Release with notes + SHA-256 + attached APK
#
# Required secrets (Settings → Secrets → Actions):
#   KEYSTORE_BASE64     base64-encoded twa/android.keystore
#                       generate with: base64 -i twa/android.keystore | pbcopy
#   KEYSTORE_PASSWORD   the keystore + key password (same value for both)
#   PUBLIC_FIREBASE_API_KEY         (already used by deploy.yml)
#   PUBLIC_FIREBASE_MEASUREMENT_ID  (already used by deploy.yml)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      notes:
        description: 'Release notes (markdown bullet points)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history + ability to push version-bump commit.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK build-tools
        uses: android-actions/setup-android@v3

      - name: Install Node deps
        run: npm ci

      # ── Version bump ─────────────────────────────────────────────────────

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          current=$(grep -oP "(?<=APP_VERSION = ')[\d.]+" src/lib/version.ts)
          IFS='.' read -r maj min pat <<< "$current"
          case "${{ inputs.bump }}" in
            major) maj=$((maj+1)); min=0; pat=0 ;;
            minor) min=$((min+1)); pat=0 ;;
            patch) pat=$((pat+1)) ;;
          esac
          next="${maj}.${min}.${pat}"
          # versionCode: increment the current one from twa-manifest.json
          current_code=$(grep -oP '(?<="appVersionCode": )\d+' twa/twa-manifest.json)
          next_code=$((current_code+1))
          echo "current=$current"     >> "$GITHUB_OUTPUT"
          echo "next=$next"           >> "$GITHUB_OUTPUT"
          echo "next_code=$next_code" >> "$GITHUB_OUTPUT"
          echo "tag=v$next"           >> "$GITHUB_OUTPUT"

      - name: Bump version files
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.next }}"
          CODE="${{ steps.ver.outputs.next_code }}"

          # src/lib/version.ts
          sed -i "s/APP_VERSION = '[0-9.]*'/APP_VERSION = '${VER}'/" src/lib/version.ts

          # public/sw.js
          sed -i "s/APP_VERSION = '[0-9.]*'/APP_VERSION = '${VER}'/" public/sw.js

          # twa/twa-manifest.json  (appVersionName + appVersionCode)
          sed -i "s/\"appVersionName\": \"[0-9.]*\"/\"appVersionName\": \"${VER}\"/" twa/twa-manifest.json
          sed -i "s/\"appVersionCode\": [0-9]*/\"appVersionCode\": ${CODE}/" twa/twa-manifest.json

          echo "Bumped to $VER (code $CODE)"
          grep APP_VERSION src/lib/version.ts
          grep appVersionName twa/twa-manifest.json

      - name: Commit + tag + push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/version.ts public/sw.js twa/twa-manifest.json
          git commit -m "${{ steps.ver.outputs.tag }}: ${{ inputs.bump }} release"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin main
          git push origin "${{ steps.ver.outputs.tag }}"
          # Keep beta in sync with the version bump
          git push origin main:beta

      # ── APK build + sign ─────────────────────────────────────────────────
      # twa/ is almost entirely gitignored (only twa-manifest.json is tracked).
      # We regenerate the full TWA project from the manifest using Bubblewrap,
      # which produces gradlew + the Android project, then build with Gradle.

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > twa/android.keystore

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build APK via Bubblewrap
        # bubblewrap build reads twa-manifest.json and produces a signed APK.
        # --skipPwaValidation avoids hitting the live site.
        # Pre-write ~/.bubblewrap/config.json so bubblewrap skips JDK/SDK prompts.
        # Run `bubblewrap update` first to generate the Android project + checksum
        # file; without it `bubblewrap build` prompts "regenerate project?" and
        # hangs in non-interactive CI (exit 130).
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' \
            "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          cd twa
          bubblewrap update \
            --manifest ./twa-manifest.json \
            --skipPwaValidation
          bubblewrap build \
            --manifest ./twa-manifest.json \
            --skipPwaValidation

      - name: Verify + rename APK
        id: sign
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"

          # bubblewrap build signs the APK itself and outputs it to the twa/ dir.
          # Find it (prefer *signed*, fall back to any release apk).
          BUILT=$(find twa -name "*signed*.apk" -o -name "*release*.apk" 2>/dev/null | grep -v unsigned | sort | tail -1)
          if [ -z "$BUILT" ]; then
            echo "No signed APK found in twa/:"
            find twa -name "*.apk" || true
            exit 1
          fi
          echo "Found APK: $BUILT"

          SIGNED="twa/carromscore-${TAG}.apk"
          cp "$BUILT" "$SIGNED"

          # Verify signatures
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$SIGNED" | grep -E "Verifies|scheme"

          SHA=$(sha256sum "$SIGNED" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "apk=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "APK: $SIGNED  SHA-256: $SHA"

      # ── GitHub Release ───────────────────────────────────────────────────

      - name: Build release notes
        id: relnotes
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          VER="${{ steps.ver.outputs.next }}"
          SHA="${{ steps.sign.outputs.sha256 }}"
          NOTES="${{ inputs.notes }}"

          cat > release-notes.md <<NOTES
          # Carromscore ${VER}

          ${NOTES:-*(no release notes provided)*}

          ---

          **SHA-256:** \`${SHA}\`
          NOTES

          echo "Release notes:"
          cat release-notes.md

      - name: Create + publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          gh release create "$TAG" \
            --title "Carromscore $TAG" \
            --notes-file release-notes.md \
            "${{ steps.sign.outputs.apk }}"

name: Deploy to GitHub Pages

# Publishes:
#   - main branch → /carromscore/ (production)
#   - `beta` branch → /carromscore/beta/ (public preview channel)
#
# The `beta` branch is a floating label: whatever release is being
# tested next gets checked out as `beta` and pushed. Keeps the URL
# stable so testers can bookmark it and reload for each build.
#
# Beta job produces a combined artifact: it clones main, builds it
# with PUBLIC_BASE=/carromscore/, then builds the beta branch with
# PUBLIC_BASE=/carromscore/beta/ and drops the result into
# dist-combined/beta/. This preserves production at the root while
# adding the preview at /beta/. Same Pages site, no separate hosting.
on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (main → /carromscore/)
        run: npm run build
        env:
          PUBLIC_BASE: /carromscore/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-main:
    if: github.ref == 'refs/heads/main'
    needs: build-main
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-beta:
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@v4

      - name: Checkout main into ./main-build
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (main)
        working-directory: main-build
        run: npm ci

      - name: Build main → dist-combined/
        working-directory: main-build
        run: npm run build
        env:
          PUBLIC_BASE: /carromscore/

      - name: Install (beta)
        run: npm ci

      - name: Build beta → dist-combined/beta/
        run: npm run build
        env:
          PUBLIC_BASE: /carromscore/beta/

      - name: Compose combined artifact
        run: |
          mkdir -p dist-combined
          cp -R main-build/dist/. dist-combined/
          mkdir -p dist-combined/beta
          cp -R dist/. dist-combined/beta/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-combined

  deploy-beta:
    if: github.ref == 'refs/heads/beta'
    needs: build-beta
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

# Publishes:
#   - main branch → /carromscore/ (production)
#   - `beta` branch → /carromscore/beta/ (public preview channel)
#
# The `beta` branch is a floating label: whatever release is being
# tested next gets checked out as `beta` and pushed. Keeps the URL
# stable so testers can bookmark it and reload for each build.
#
# Beta job produces a combined artifact by BUILDING main from source
# (not wget-mirroring the live site — wget can't fetch JS bundles
# that Astro islands import dynamically, so mirrors were serving
# broken HTML for main → blank screen on production). Both branches
# are built inside their own workspace directories so tsconfig
# extension resolution works correctly.
#
# Emergency safeguard: on ANY beta build failure, the deploy-beta
# step is skipped so a broken beta artifact never overwrites main.
on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (main → /carromscore/)
        run: npm run build
        env:
          PUBLIC_BASE: /carromscore/
          # Firebase Web API key — see src/lib/firebase.ts for the
          # "public identifier, not a secret" rationale. Sourced from
          # the repo secret so the literal doesn't sit in source.
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          # GA4 measurement id. Public identifier (baked into every gtag
          # snippet); env-var'd for symmetry with the API key. Missing
          # value = analytics silently disabled (src/lib/analytics.ts).
          PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.PUBLIC_FIREBASE_MEASUREMENT_ID }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-main:
    if: github.ref == 'refs/heads/main'
    needs: build-main
    runs-on: ubuntu-latest
    concurrency:
      group: pages-main
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-beta:
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    defaults:
      run:
        # Every step runs in ./beta by default so npm/astro resolve
        # from the beta checkout's own node_modules. Main is built
        # in a sibling dir with its own working-directory override.
        working-directory: ./beta
    steps:
      - name: Checkout beta branch → ./beta
        uses: actions/checkout@v4
        with:
          path: beta

      - name: Checkout main branch → ./main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            beta/package-lock.json
            main/package-lock.json

      # Install + build main FIRST so a failure here fails the whole
      # job, preventing deploy-beta from ever publishing a beta-only
      # artifact that would blank out production.
      - name: Install (main)
        working-directory: ./main
        run: npm ci

      - name: Build main → main/dist/
        working-directory: ./main
        run: npm run build
        env:
          PUBLIC_BASE: /carromscore/
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          # GA4 measurement id. Public identifier (baked into every gtag
          # snippet); env-var'd for symmetry with the API key. Missing
          # value = analytics silently disabled (src/lib/analytics.ts).
          PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.PUBLIC_FIREBASE_MEASUREMENT_ID }}

      - name: Install (beta)
        run: npm ci

      - name: Build beta → beta/dist/
        run: npm run build
        env:
          PUBLIC_BASE: /carromscore/beta/
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          # GA4 measurement id. Public identifier (baked into every gtag
          # snippet); env-var'd for symmetry with the API key. Missing
          # value = analytics silently disabled (src/lib/analytics.ts).
          PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.PUBLIC_FIREBASE_MEASUREMENT_ID }}

      # Compose the final artifact: main at root, beta under /beta/.
      # Runs from repo root (default working-directory override
      # doesn't apply to composite bash blocks with cd).
      - name: Compose combined artifact
        working-directory: .
        run: |
          set -euo pipefail
          rm -rf dist-combined
          mkdir -p dist-combined
          cp -R main/dist/. dist-combined/
          mkdir -p dist-combined/beta
          cp -R beta/dist/. dist-combined/beta/
          # Sanity checks: fail the job if the artifact is missing
          # any of the JS bundles that the HTML references. Prevents
          # the "production goes blank" incident from ever recurring.
          # Strip the /carromscore/ base prefix from each referenced
          # URL and check that the resulting file exists under
          # dist-combined/. Bug fixed 2026-08-13: earlier version
          # produced paths like `dist-combined./_astro/...` from an
          # accidental `.` prepend on the URL suffix; corrected here.
          echo "== Verifying main artifact =="
          test -f dist-combined/index.html
          for js in $(grep -oE '/carromscore/_astro/[A-Za-z]+\.[A-Za-z0-9_-]+\.js' dist-combined/index.html || true); do
            local_path="dist-combined${js#/carromscore}"
            if [ ! -f "$local_path" ]; then
              echo "::error::main HTML references $js but $local_path is missing"
              exit 1
            fi
          done
          echo "== Verifying beta artifact =="
          test -f dist-combined/beta/index.html
          for js in $(grep -oE '/carromscore/beta/_astro/[A-Za-z]+\.[A-Za-z0-9_-]+\.js' dist-combined/beta/index.html || true); do
            local_path="dist-combined${js#/carromscore}"
            if [ ! -f "$local_path" ]; then
              echo "::error::beta HTML references $js but $local_path is missing"
              exit 1
            fi
          done
          echo "OK — main + beta both self-consistent"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-combined

  deploy-beta:
    if: github.ref == 'refs/heads/beta'
    needs: build-beta
    runs-on: ubuntu-latest
    concurrency:
      group: pages-beta
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
